
name: Build BISSAU DRIP APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "Bissau drip project.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q "Bissau drip project.zip" -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Não foi encontrado gradlew no ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BISSAU-DRIP-APK
          path: extracted/**/build/outputs/apk/**/*.apk
